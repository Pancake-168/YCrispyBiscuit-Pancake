name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Pancake/Client/Tauri-React/Pancake-Tauri-React/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Pancake/Client/Tauri-React/Pancake-Tauri-React

      - name: Build
        run: WEB_BUILD=true pnpm exec vite build
        working-directory: Pancake/Client/Tauri-React/Pancake-Tauri-React

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Pancake/Client/Tauri-React/Pancake-Tauri-React/dist
